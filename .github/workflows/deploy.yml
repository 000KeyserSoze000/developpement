name: 🚀 Deploy ContentPro.fr

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  NODE_VERSION: '20'
  APP_PATH: /var/www/vhosts/contentpro.fr/app

jobs:
  # ===========================================
  # Build & Test
  # ===========================================
  build:
    name: 📦 Build & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📌 Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Run linter
        run: bun run lint
        continue-on-error: true

      - name: 🏗️ Build application
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next/standalone
            .next/static
            public
            package.json
            ecosystem.config.js
          retention-days: 1

  # ===========================================
  # Deploy to Production
  # ===========================================
  deploy:
    name: 🚀 Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./deploy

      - name: 📁 Prepare deployment package
        run: |
          cd deploy
          mkdir -p .next/standalone/.next/static
          cp -r .next/static/* .next/standalone/.next/static/
          cp -r public .next/standalone/

      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            echo "🛑 Stopping PM2 process..."
            pm2 stop contentpro || true
            
            echo "📦 Creating backup..."
            if [ -d "${{ env.APP_PATH }}" ]; then
              BACKUP_DIR="${{ env.APP_PATH }}_backup_$(date +%Y%m%d_%H%M%S)"
              mv ${{ env.APP_PATH }} $BACKUP_DIR
              echo "✅ Backup created: $BACKUP_DIR"
            fi

      - name: 📤 Copy files to VPS
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "deploy/.next/standalone/*,deploy/package.json,deploy/ecosystem.config.js"
          target: ${{ env.APP_PATH }}
          strip_components: 2

      - name: 🔧 Post-deployment setup
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            
            echo "📁 Setting up application directory..."
            mkdir -p ${{ env.APP_PATH }}
            mkdir -p /var/www/vhosts/contentpro.fr/logs
            
            echo "🔐 Setting permissions..."
            chown -R www-data:www-data /var/www/vhosts/contentpro.fr
            chmod -R 755 ${{ env.APP_PATH }}
            
            echo "🔄 Starting PM2 process..."
            cd ${{ env.APP_PATH }}
            pm2 start ecosystem.config.js --env production
            pm2 save
            
            echo "✅ Deployment completed successfully!"
            pm2 status

  # ===========================================
  # Notify on Success
  # ===========================================
  notify-success:
    name: ✅ Notify Success
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: ✅ Deployment successful
        run: |
          echo "🎉 ContentPro.fr deployed successfully!"
          echo "🌐 URL: https://contentpro.fr"

  # ===========================================
  # Notify on Failure
  # ===========================================
  notify-failure:
    name: ❌ Notify Failure
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: ❌ Deployment failed
        run: |
          echo "❌ Deployment failed! Check the logs for details."
          exit 1
